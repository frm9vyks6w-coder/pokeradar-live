name: PokéRadar prijs- en voorraadcontrole
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: pokeradar-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Controleer winkelprijzen en stuur alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor/check.py
      - name: Publiceer gewijzigde resultaten
        run: |
          git config user.name 'pokeradar-bot'
          git config user.email 'pokeradar-bot@users.noreply.github.com'
          git add site/radar.json data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Radar controle bijwerken'
            git push
          fi
